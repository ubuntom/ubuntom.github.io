<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DDR World Score Uploader</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #0f1117;
      color: #f3f4f6;
    }

    .container {
      width: 100%;
      max-width: 600px;
      padding: 32px;
      background: #181b23;
      border: 1px solid #292d38;
      border-radius: 14px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    .description {
      margin: 0 0 28px;
      color: #9ca3af;
    }

    .field {
      margin-bottom: 24px;
    }

    label.field-label {
      display: block;
      margin-bottom: 9px;
      font-weight: 600;
      color: #e5e7eb;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      background: #10131a;
      color: #f3f4f6;
      border: 1px solid #343946;
      border-radius: 7px;
      font-size: 14px;
    }

    input[type="text"]::placeholder {
      color: #6b7280;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #6366f1;
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.18);
    }

    /* File input */
    input[type="file"] {
      width: 100%;
      padding: 10px;
      color: #9ca3af;
      background: #10131a;
      border: 1px solid #343946;
      border-radius: 7px;
      cursor: pointer;
    }

    input[type="file"]::file-selector-button {
      margin-right: 10px;
      padding: 7px 12px;
      border: 0;
      border-radius: 5px;
      background: #292d38;
      color: #e5e7eb;
      cursor: pointer;
    }

    input[type="file"]::file-selector-button:hover {
      background: #343946;
    }

/* P1 <o-> P2 switch */
.priority-control {
  display: flex;
  align-items: center;
  gap: 12px;
}

.priority-option {
  font-weight: 700;
  font-size: 14px;
  color: #6b7280;
  transition: color 0.2s, background 0.2s;
  min-width: 30px;
  padding: 5px 7px;
  border-radius: 5px;
  text-align: center;
}

.priority-option.active.p1 {
  color: #bfe3ff;
  background: rgba(147, 197, 253, 0.12);
}

.priority-option.active.p2 {
  color: #ffc4d6;
  background: rgba(244, 114, 182, 0.12);
}

.priority-switch {
  position: relative;
  width: 58px;
  height: 30px;
}

.priority-switch input {
  display: none;
}

.priority-slider {
  position: absolute;
  inset: 0;
  background: #292d38;
  border: 1px solid #3b404d;
  border-radius: 999px;
  cursor: pointer;
  transition: background 0.2s;
}

.priority-slider::after {
  content: "";
  position: absolute;
  width: 22px;
  height: 22px;
  top: 3px;
  left: 3px;
  background: #f3f4f6;
  border-radius: 50%;
  transition: transform 0.2s;
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.4);
}

.priority-switch input:checked + .priority-slider {
  background: #373b4a;
}

.priority-switch input:checked + .priority-slider::after {
  transform: translateX(28px);
}


    button {
      width: 100%;
      padding: 13px 16px;
      border: 0;
      border-radius: 7px;
      background: #6366f1;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover:not(:disabled) {
      background: #5458e8;
    }

    button:disabled {
      background: #3d4160;
      color: #9ca3af;
      cursor: not-allowed;
    }


    .result {
      display: none;
      margin-top: 12px;
      padding: 13px 14px;
      border-radius: 7px;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 14px;
    }

    .result.error {
      margin-top: 0;
      margin-bottom: 12px;
      background: #2a1518;
      color: #fca5a5;
      border: 1px solid #653037;
    }

    .result.success {
      margin-top: 12px;
      background: #10251d;
      color: #6ee7b7;
      border: 1px solid #1d5c46;
    }

    .processing-time {
      display: none;
      margin-top: 10px;
      text-align: center;
      font-size: 12px;
      color: #9ca3af;
    }

    .sheet-note { margin-top: 8px; font-size: 12px; line-height: 1.5; color: #9ca3af; } .sheet-note strong { color: #d1d5db; font-weight: 600; }
  </style>
</head>

<body>
  <main class="container">
    <h1>DDR World Score Uploader</h1>

    <p class="description">
      Upload up to 10 photos and write the extracted scores to Google Sheets.
    </p>

    <form id="uploadForm">

      <div class="field">
        <label class="field-label">Player side</label>

        <div class="priority-control">
          <span id="p1Label" class="priority-option active p1">P1</span>

<label class="priority-switch">
  <input type="checkbox" id="prioritySwitch" />
  <span class="priority-slider"></span>
</label>

<span id="p2Label" class="priority-option p2">P2</span>
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="sheetId">
          Google Sheets URL
        </label>

        <input
          type="text"
          id="sheetId"
          name="sheetId"
          placeholder="Enter Google Sheets ID"
          required
        />

        <div class="sheet-note">
  Note: Before uploading you must make
  <strong>score-uploader@ddr-photo.iam.gserviceaccount.com</strong>
  an editor of the sheet or make it editable to anyone with the link.
</div>
      </div>

      <div class="field">
        <label class="field-label" for="files">
          Files (maximum 10)
        </label>

        <input
          type="file"
          id="files"
          name="files"
          multiple
          required
        />
      </div>

      
      <div id="errorResult" class="result error"></div>

      <button type="submit" id="submitButton">
        Upload
      </button>

      <div id="processingTime" class="processing-time"></div>

      <div id="successResult" class="result success"></div>

    </form>

    <div id="result" class="result"></div>
  </main>

<script>
  // Set this to your API base URL.
  const ENDPOINT = "https://ddr-photo-669586076025.europe-west1.run.app";

  const form = document.getElementById("uploadForm");
  const prioritySwitch = document.getElementById("prioritySwitch");
  const p1Label = document.getElementById("p1Label");
  const p2Label = document.getElementById("p2Label");
  const filesInput = document.getElementById("files");
  const sheetIdInput = document.getElementById("sheetId");
  const submitButton = document.getElementById("submitButton");
  const errorResult = document.getElementById("errorResult");
  const successResult = document.getElementById("successResult");
  const processingTime = document.getElementById("processingTime");

  // Restore the previously saved Google Sheets ID.
  const savedSheetId = localStorage.getItem("googleSheetsId");

  if (savedSheetId) {
    sheetIdInput.value = savedSheetId;
  }

  // Save the Sheets ID whenever it changes.
  sheetIdInput.addEventListener("input", () => {
    localStorage.setItem("googleSheetsId", sheetIdInput.value.trim());
  });

  function extractSheetId(value) {
    const input = value.trim();

    // If it's a Sheets URL or partial Sheets URL, extract the ID
    // from /spreadsheets/d/{ID}.
    const urlMatch = input.match(
      /(?:^|\/)spreadsheets\/d\/([a-zA-Z0-9_-]+)/
    );

    if (urlMatch) {
      return urlMatch[1];
    }

    // Otherwise assume the user entered the ID directly.
    return input;
  }

  // Priority switch.
  prioritySwitch.addEventListener("change", () => {
    const isP2 = prioritySwitch.checked;

    p1Label.classList.toggle("active", !isP2);
    p2Label.classList.toggle("active", isP2);
  });

  filesInput.addEventListener("change", () => {
    const count = filesInput.files.length;

    if (count > 0) {
      const seconds = 3 + count * 8;

      processingTime.textContent =
        `Estimated processing time ${seconds} seconds`;

      processingTime.style.display = "block";
    } else {
      processingTime.textContent = "";
      processingTime.style.display = "none";
    }
  });

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    successResult.style.display = "none";
    errorResult.style.display = "none";

    const files = Array.from(filesInput.files);
    const sheetId = extractSheetId(sheetIdInput.value.trim());

    if (files.length === 0) {
      showError("Please select at least one file.");
      return;
    }

    if (files.length > 10) {
      showError("You can upload a maximum of 10 files.");
      return;
    }

    if (!sheetId) {
      showError("Please enter a Google Sheets ID.");
      return;
    }

    // Make sure the latest value is saved.
    localStorage.setItem("googleSheetsId", sheetId);

    // P1 when unchecked, P2 when checked.
    const p = prioritySwitch.checked ? "2" : "1";

    const url =
      `${ENDPOINT}/extract_upload/v1/${p}/${encodeURIComponent(sheetId)}`;

    const formData = new FormData();

    files.forEach((file) => {
      formData.append("files", file);
    });

    submitButton.disabled = true;
    submitButton.textContent = "Uploading...";

    const startTime = performance.now();

    try {
      const response = await fetch(url, {
        method: "POST",
        body: formData
      });

      const responseText = await response.text();

      if (!response.ok) {
        let errorMessage = responseText;

        try {
          const errorData = JSON.parse(responseText);

          if (errorData.detail) {
            errorMessage = errorData.detail;
          }
        } catch {
          // Response wasn't JSON, so use the raw response text.
        }

        showError(
          errorMessage || `Request failed with status ${response.status}.`
        );

        return;
      }

      let data;

      try {
        data = JSON.parse(responseText);
      } catch {
        showError(
          responseText || "The server returned invalid JSON."
        );
        return;
      }

      const elapsedSeconds = Math.round(
        (performance.now() - startTime) / 1000
      );

      const written = Array.isArray(data.written)
        ? data.written.length
        : Number(data.written) || 0;

      showSuccess(
        `${written} row${written === 1 ? "" : "s"} written in ${elapsedSeconds} second${elapsedSeconds === 1 ? "" : "s"}.`
      );

    } catch (error) {
      showError(
        error.message || "An unexpected error occurred."
      );
    } finally {
      submitButton.disabled = false;
      submitButton.textContent = "Upload";
    }
  });

  function showSuccess(message) {
    successResult.textContent = message;
    successResult.style.display = "block";
  }

  function showError(message) {
    errorResult.textContent = message;
    errorResult.style.display = "block";
  }
</script>

</body>
</html>
